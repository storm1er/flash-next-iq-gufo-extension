# Build the Gufo binary (upstream at .upstream-rev + this extension) and
# publish both container variants on every push to main:
#
#   <IMAGE>:latest              slim, mount host /opt/rocm read-only
#   <IMAGE>:latest-rocm         ROCm userspace baked in, no volume
#   <IMAGE>:sha-<short>[…]      immutable copies of this run
#
# The `module` job builds the extension the way the Gufo extension registry
# does, with `gufo extension install` in the stock gufo-runtime image of the
# same Gufo release.
#
# Semver tags remain manual stable pins. The build runs in
# AMD's ROCm 10.0 dev image so the baked userspace matches the production
# host's core-10.0 driver generation; hipcc compiles without a GPU (the
# target is fixed to gfx1151 by Gufo's CMakeLists).
name: images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/storm1er/flash-next-iq-gufo-extension
  # The stock runtime of the Gufo release in .upstream-rev.
  RUNTIME_IMAGE: ghcr.io/gufo-org/toolboxes/gufo-runtime:0.34.0

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      # Keep in sync with tools/rocm-subset.sh assumptions (per-arch
      # hipBLASLt/rocBLAS tuning dirs under /opt/rocm/lib).
      image: rocm/dev-ubuntu-24.04:10.0.0-full
      options: --user root --volume /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build pkg-config docker.io jq curl \
            libicu-dev libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libpng-dev libjpeg-dev libwebp-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
          # Gufo's Rust components need the toolchain its rust-toolchain.toml
          # pins (newer than Ubuntu's cargo); rustup installs it on first use.
          curl -fsS --proto '=https' --tlsv1.2 https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          path: ext

      - name: Resolve pinned upstream revision
        id: rev
        run: |
          # .upstream-rev may hold an abbreviated SHA; checkout needs the full
          # commit SHA (branch/tag refspecs never match an abbreviation).
          sha=$(curl -fsS "https://api.github.com/repos/gufo-org/gufo/commits/$(cat ext/.upstream-rev)" | jq -r .sha)
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "full=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: gufo-org/gufo
          ref: ${{ steps.rev.outputs.full }}
          path: gufo

      - name: Configure (full extension discovery + this extension)
        working-directory: gufo
        run: cmake --preset release -DGUFO_EXTENSION_DIRS="$GITHUB_WORKSPACE/ext"

      - name: Build gufo
        working-directory: gufo
        run: |
          cmake --build --preset release --target gufo -j"$(nproc)"
          # Gate (no GPU needed): the binary must load against the dev image's
          # ROCm userspace and register this extension's provider as available.
          LD_LIBRARY_PATH=/opt/rocm/lib ./build/release/gufo diagnose \
            --section extensions --json |
            jq -e 'any(.builtExtensions[]; .name == "flash_next_iq") and
                   any(.providers[]; .id == "flash-next-iq" and .available)'

      - name: Build and push both variants
        shell: bash
        env:
          REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short="${GITHUB_SHA::7}"
          echo "$REG_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" \
            --password-stdin
          mkdir -p ext/dist
          cp gufo/build/release/gufo ext/dist/gufo
          docker build -f ext/docker/runtime.Dockerfile \
            -t "$IMAGE:latest" -t "$IMAGE:sha-$short" ext
          ext/tools/rocm-subset.sh gufo/build/release/gufo /tmp/rocm-image
          docker build -f ext/docker/runtime-rocm.Dockerfile \
            --build-arg BASE="$IMAGE:latest" \
            -t "$IMAGE:latest-rocm" -t "$IMAGE:sha-$short-rocm" /tmp/rocm-image
          # Smoke (no GPU): the ROCm-baked image is self-contained, so it runs
          # as a plain sibling container and must expose the provider.
          docker run --rm "$IMAGE:latest-rocm" gufo diagnose \
            --section extensions --json |
            jq -e 'any(.builtExtensions[]; .name == "flash_next_iq") and
                   any(.providers[]; .id == "flash-next-iq" and .available)'
          for tag in latest "sha-$short" latest-rocm "sha-$short-rocm"; do
            docker push "$IMAGE:$tag"
          done

  module:
    # The registry's install path: build this checkout as a loadable module
    # for the stock Gufo release and require the provider to be available.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: ext

      - name: gufo extension install (stock runtime)
        run: |
          mkdir -p store
          chmod 777 store
          docker run --rm \
            -v "$GITHUB_WORKSPACE/ext:/src/flash-next-iq-gufo-extension:ro" \
            -v "$GITHUB_WORKSPACE/store:/home/gufo/.local/share/gufo/extensions" \
            "$RUNTIME_IMAGE" \
            gufo extension install /src/flash-next-iq-gufo-extension --yes
          docker run --rm \
            -v "$GITHUB_WORKSPACE/store:/home/gufo/.local/share/gufo/extensions" \
            "$RUNTIME_IMAGE" gufo diagnose --section extensions --json |
            jq -e 'any(.providers[]; .id == "flash-next-iq" and .available)'
